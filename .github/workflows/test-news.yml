name: Test news content pipeline
on:
  pull_request:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-news.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
