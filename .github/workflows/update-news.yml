name: Update News Data

on:
  workflow_dispatch:
  schedule:
    - cron: '7 23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: money-news-daily
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Chinese daily news-data.json
        run: python scripts/fetch_daily_news.py

      - name: Validate JSON and Chinese output
        run: |
          python - <<'PY'
          import json
          import re
          import sys

          with open('news-data.json', encoding='utf-8') as f:
              data = json.load(f)

          if not isinstance(data, list) or len(data) < 3:
              raise SystemExit('Need at least 3 valid news items')

          cjk = re.compile(r'[\u3400-\u9fff]')
          required = ['title', 'summary', 'content', 'opportunity', 'risk', 'why_it_matters']
          for i, item in enumerate(data):
              for field in required:
                  value = str(item.get(field, ''))
                  if not cjk.search(value):
                      raise SystemExit(f'Item {i} field {field} is not Chinese: {value}')
              if not item.get('source_url'):
                  raise SystemExit(f'Item {i} missing source_url')

          print(f'Validated {len(data)} Chinese news items.')
          PY

      - name: Commit and push changed news data
        run: |
          if git diff --quiet -- news-data.json; then
            echo "No changes detected in news-data.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news-data.json
            git commit -m "chore: auto-update Chinese news-data.json"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    runs-on: ubuntu-latest
    needs: update-news
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
