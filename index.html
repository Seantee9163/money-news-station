<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钱线简报 | 首页</title>
    <meta name="description" content="钱线简报（Money Opportunity Brief）提供聚焦政策、产业与资金流的商业机会情报，帮助你快速定位高价值跟踪方向。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-cn">钱线简报</span>
          <span class="brand-en">Money Opportunity Brief</span>
        </a>
        <nav class="top-nav" aria-label="主导航">
          <a href="index.html" aria-current="page">首页情报</a>
          <a href="category.html">主题分类</a>
          <a href="archive.html">历史归档</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero section-card">
        <div class="hero-main">
          <div class="hero-topline">
            <p class="eyebrow">Money Opportunity Brief</p>
            <p class="update-badge">今日更新日期：<span id="today-update-date">加载中...</span></p>
          </div>
          <h1>钱线简报 · 今日核心机会</h1>
          <p class="muted" id="hero-title">加载中...</p>
          <p class="muted" id="hero-summary">加载中...</p>
          <div class="hero-stats" id="hero-stats">
            <div class="stat-item">
              <span class="stat-label">今日更新</span>
              <strong id="today-count">0</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label">置顶新闻</span>
              <strong id="pinned-count">0</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label">覆盖主题</span>
              <strong id="category-count">0</strong>
            </div>
          </div>
        </div>
        <div class="hero-actions">
          <a class="btn" id="hero-link" href="article.html?id=1">查看核心情报</a>
          <button class="btn btn-secondary filter-btn" id="today-filter-toggle" type="button">只看今日更新</button>
        </div>
      </section>

      <section class="section-head">
        <h2>主题分类</h2>
        <a class="text-link" href="category.html">查看全部主题 →</a>
      </section>
      <section class="grid cols-4" id="category-nav"></section>

      <section class="section-head">
        <h2>最新情报</h2>
        <div class="head-actions">
          <span class="inline-hint" id="news-feed-label">显示全部情报</span>
          <a class="text-link" href="archive.html">查看历史归档 →</a>
        </div>
      </section>
      <section class="filter-row">
        <label for="home-date-filter">按日期筛选：</label>
        <input type="date" id="home-date-filter" />
        <button class="chip" id="clear-home-date-filter" type="button">清空日期</button>
      </section>
      <section class="grid cols-3" id="latest-news"></section>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 钱线简报（Money Opportunity Brief）. All rights reserved.</div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
